name: Deploy RAG App to AWS App Runner

# 触发器：当推送到 main 分支且 devops_rag 文件夹有变化时
on:
  push:
    branches:
      - main
    paths:
      - 'devops_rag/**'
      - '.github/workflows/deploy-rag-app.yml'
    paths-ignore:
      - 'devops_rag/README.md'

# 环境变量：从 GitHub Secrets 读取
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  AWS_IAM_ROLE: ${{ secrets.AWS_IAM_ROLE_TO_ASSUME }}

# 权限：允许 workflow 从 OIDC 获取身份 token
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push to ECR, and Deploy to App Runner
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: devops_rag

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 AWS 凭证 (使用 OIDC，无需 Access Key)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. 登录到 ECR
      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. 定义镜像标签 (使用 GitHub SHA)
      - name: Define Image Tag
        id: image-tag
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # 5. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 6. 查找或创建 App Runner 服务
      - name: Find or get App Runner service ARN
        id: find-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region "${{ env.AWS_REGION }}" \
            --query "ServiceSummaryList[?ServiceName=='bee-edu-rag-service'].ServiceArn" \
            --output text)
          
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "Service does not exist, will be created by deploy action"
            echo "SERVICE_EXISTS=false" >> $GITHUB_ENV
          else
            echo "✅ Found existing service: $SERVICE_ARN"
            echo "SERVICE_ARN=$SERVICE_ARN" >> $GITHUB_ENV
            echo "SERVICE_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Fetch App Runner role ARNs (if service exists)
        if: env.SERVICE_EXISTS == 'true'
        run: |
          ACCESS_ROLE_ARN=$(aws apprunner describe-service \
            --region "${{ env.AWS_REGION }}" \
            --service-arn "${{ env.SERVICE_ARN }}" \
            --query 'Service.SourceConfiguration.AuthenticationConfiguration.AccessRoleArn' \
            --output text)
          INSTANCE_ROLE_ARN=$(aws apprunner describe-service \
            --region "${{ env.AWS_REGION }}" \
            --service-arn "${{ env.SERVICE_ARN }}" \
            --query 'Service.InstanceConfiguration.InstanceRoleArn' \
            --output text)
          echo "APP_RUNNER_ACCESS_ROLE_ARN=$ACCESS_ROLE_ARN" >> $GITHUB_ENV
          echo "APP_RUNNER_INSTANCE_ROLE_ARN=$INSTANCE_ROLE_ARN" >> $GITHUB_ENV
      
      - name: Get role ARNs and secret ARN from secrets (if service doesn't exist)
        if: env.SERVICE_EXISTS == 'false'
        run: |
          echo "APP_RUNNER_ACCESS_ROLE_ARN=${{ secrets.ACCESS_ROLE_ARN }}" >> $GITHUB_ENV
          echo "APP_RUNNER_INSTANCE_ROLE_ARN=${{ secrets.INSTANCE_ROLE_ARN }}" >> $GITHUB_ENV
          # Get secret ARN for OpenAI API key
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id bee-edu-openai-key-secret \
            --region "${{ env.AWS_REGION }}" \
            --query 'ARN' \
            --output text)
          echo "OPENAI_SECRET_ARN=$SECRET_ARN" >> $GITHUB_ENV

      - name: Get secret ARN (if service exists, for update)
        if: env.SERVICE_EXISTS == 'true'
        run: |
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id bee-edu-openai-key-secret \
            --region "${{ env.AWS_REGION }}" \
            --query 'ARN' \
            --output text)
          echo "OPENAI_SECRET_ARN=$SECRET_ARN" >> $GITHUB_ENV

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: bee-edu-rag-service
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.TAG }}
          region: ${{ env.AWS_REGION }}
          access-role-arn: ${{ env.APP_RUNNER_ACCESS_ROLE_ARN }}
          instance-role-arn: ${{ env.APP_RUNNER_INSTANCE_ROLE_ARN }}
          port: 8080
          cpu: 1
          memory: 2
          wait-for-service-stability-seconds: 600
          
      - name: Deployment Complete
        run: echo "✅ Deployment to App Runner successful!"
